<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>(주)에스에이치 비품관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#22221F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="비품관리">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --ink: #22221F;
    --ink-dim: #6B6A63;
    --line: #E4E2DA;
    --accent-1: #2F5233;
    --accent-2: #2B4C7E;
    --ok: #3E7C4A; --ok-bg: #E7F1E6;
    --bad: #B5622C; --bad-bg: #FBEADD;
    --waste: #A63A34; --waste-bg: #FBE4E2;
    --check: #6B5B95; --check-bg: #EEEAF6;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 60px; }
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 16px 16px 0; border-bottom: 1px solid var(--line); }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; font-weight: 800; }
  .lock-btn { display: flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; color: var(--ink-dim); cursor: pointer; }
  .lock-btn.unlocked { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .lock-btn svg { width: 13px; height: 13px; }
  .view-tabs { display: flex; gap: 4px; margin-bottom: 0; }
  .view-tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 13.5px; font-weight: 700; color: var(--ink-dim); border-bottom: 2.5px solid transparent; cursor: pointer; }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--ink); }

  .toolbar { padding: 12px 16px 10px; }
  .center-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .center-tab { flex: 1; padding: 9px 8px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13.5px; text-align: center; cursor: pointer; color: var(--ink-dim); transition: all .15s ease; }
  .center-tab.active[data-c="1센터"] { background: var(--accent-1); border-color: var(--accent-1); color: #fff; }
  .center-tab.active[data-c="2센터"] { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .center-tab.active[data-c="전체"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .center-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; color: #fff; flex-shrink: 0; }
  .center-badge.c1 { background: var(--accent-1); } .center-badge.c2 { background: var(--accent-2); } .center-badge.c3 { background: var(--ink-dim); }

  .search-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .search-box { flex: 1; position: relative; }
  .search-box input { width: 100%; padding: 10px 12px 10px 34px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; color: var(--ink); outline: none; }
  .search-box input:focus { border-color: var(--ink-dim); }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--ink-dim); }
  .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-dim); font-size: 16px; cursor: pointer; display: none; padding: 4px; }
  .audit-toggle-btn { flex-shrink: 0; padding: 0 14px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; }
  .audit-toggle-btn.active { background: var(--check-bg); border-color: var(--check); color: var(--check); }

  .status-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .status-chip { flex-shrink: 0; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-dim); cursor: pointer; white-space: nowrap; }
  .status-chip.active[data-s="정상"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .status-chip.active[data-s="불량"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .status-chip.active[data-s="폐기"] { background: var(--waste-bg); border-color: var(--waste); color: var(--waste); }
  .status-chip.active[data-s="확인필요"] { background: var(--check-bg); border-color: var(--check); color: var(--check); }
  .status-chip.active[data-s="all"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .summary-bar { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 16px 4px; font-size: 12.5px; color: var(--ink-dim); }
  .summary-bar b { color: var(--ink); font-size: 13.5px; }

  main { padding: 4px 16px 20px; }
  .zone-group { margin-top: 14px; }
  .zone-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; cursor: pointer; user-select: none; }
  .zone-title { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .zone-pin { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .zone-meta { font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
  .chevron { width: 14px; height: 14px; stroke: var(--ink-dim); transition: transform .15s ease; }
  .zone-group.collapsed .chevron { transform: rotate(-90deg); }
  .zone-group.collapsed .item-list { display: none; }

  .item-list { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item-row:last-child { border-bottom: none; }
  .item-row:active { background: var(--bg); }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 13.5px; font-weight: 600; line-height: 1.35; word-break: keep-all; }
  .item-model { font-size: 11.5px; color: var(--ink-dim); margin-top: 1px; }
  .item-note-flag { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--check); margin-top: 3px; }
  .item-note-flag svg { width: 11px; height: 11px; stroke: var(--check); flex-shrink: 0; }
  .audited-flag { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--ok); margin-top: 3px; margin-left: 8px; }
  .request-flag { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--bad); margin-top: 3px; margin-left: 8px; }
  .request-flag svg { width: 11px; height: 11px; stroke: var(--bad); flex-shrink: 0; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .qty { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .status-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .status-badge.정상 { background: var(--ok-bg); color: var(--ok); }
  .status-badge.불량 { background: var(--bad-bg); color: var(--bad); }
  .status-badge.폐기 { background: var(--waste-bg); color: var(--waste); }
  .status-badge.확인필요 { background: var(--check-bg); color: var(--check); }
  .quick-check-btn { border: 1.5px solid var(--ok); background: var(--ok-bg); color: var(--ok); border-radius: 999px; width: 30px; height: 30px; font-size: 15px; font-weight: 800; cursor: pointer; flex-shrink: 0; display:flex; align-items:center; justify-content:center; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-dim); font-size: 13.5px; }

  /* ---- Dashboard ---- */
  .dash { padding: 14px 16px 10px; }
  .dash-hero { background: var(--ink); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .dash-hero-label { font-size: 12px; opacity: .65; font-weight: 600; margin-bottom: 6px; }
  .dash-hero-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .dash-hero-stat .num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .dash-hero-stat .lbl { font-size: 11.5px; opacity: .7; margin-top: 2px; }
  .dash-grid { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .dash-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .dash-card.clickable, .bar-row.clickable { cursor: pointer; }
  .dash-card.clickable:active, .bar-row.clickable:active { background: var(--bg); }
  .dash-card-label { font-size: 11px; font-weight: 700; color: var(--ink-dim); margin-bottom: 6px; }
  .dash-card-value { font-size: 20px; font-weight: 800; }
  .dash-card-sub { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
  .section-title { font-size: 13.5px; font-weight: 800; margin: 18px 2px 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
  .bar-label { width: 62px; flex-shrink: 0; font-weight: 700; color: var(--ink-dim); }
  .bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-val { width: 54px; text-align: right; flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .progress-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-top .t { font-size: 13.5px; font-weight: 800; }
  .progress-top .v { font-size: 12.5px; color: var(--ink-dim); }
  .progress-track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--check); border-radius: 999px; transition: width .3s ease; }
  .mismatch-banner { display: flex; align-items: center; gap: 8px; background: var(--bad-bg); color: var(--bad); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; font-weight: 700; margin-top: 10px; cursor: pointer; }
  .mismatch-banner svg { width: 15px; height: 15px; flex-shrink: 0; }

  .section-title-row { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
  .section-title-row .section-title { margin: 0; }
  .mini-add-btn { border: none; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .scanner-list { background: transparent; }
  .pm3-columns { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .pm3-col { flex: 0 0 148px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .pm3-col-title { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
  .pm3-col-total { font-size: 10.5px; color: var(--ink-dim); font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .pm3-col-row { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: default; }
  .pm3-col-row:last-child { border-bottom: none; }
  .pm3-col-row[data-scan-edit] { cursor: pointer; }
  .pm3-col-row[data-scan-edit]:active { opacity: .6; }
  .pm3-zone { font-size: 12px; font-weight: 700; margin-bottom: 2px; word-break: keep-all; }
  .pm3-nums { font-size: 10.5px; color: var(--ink-dim); }

  .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .qa-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: center; }
  .qa-btn svg { width: 20px; height: 20px; stroke: var(--ink-dim); }

  .excel-mini-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .excel-mini-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .excel-mini-btn svg { width: 16px; height: 16px; stroke: var(--ink-dim); flex-shrink: 0; }
  .excel-mini-btn:active { background: var(--bg); }

  .gsheet-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .gsheet-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .gsheet-title { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .gsheet-title svg { width: 14px; height: 14px; stroke: var(--check); flex-shrink: 0; }
  .gsheet-status { font-size: 11px; color: var(--ink-dim); }
  .gsheet-row { display: flex; gap: 6px; }
  .gsheet-input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); font-size: 12.5px; background: var(--bg); color: var(--ink); outline: none; }
  .gsheet-input:focus { border-color: var(--ink-dim); }
  .gsheet-btn { flex-shrink: 0; padding: 8px 12px; border-radius: 8px; border: none; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
  .gsheet-btn.secondary { background: var(--check-bg); color: var(--check); }
  .gsheet-hint { font-size: 10.5px; color: var(--ink-dim); margin-top: 6px; line-height: 1.5; }
  .gsheet-synced-row { display: flex; align-items: center; justify-content: space-between; }

  .dash-hero-stat.clickable { cursor: pointer; }
  .dash-hero-stat.clickable:active { opacity: .7; }

  .activity-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .activity-row { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .activity-row:last-child { border-bottom: none; }
  .activity-row .t1 { font-weight: 600; }
  .activity-row .t2 { color: var(--ink-dim); font-size: 11px; margin-top: 2px; }
  .empty-activity { padding: 20px; text-align: center; color: var(--ink-dim); font-size: 12.5px; }

  /* ---- Sheet / modal ---- */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(20,20,18,0.42); z-index: 50; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 20px 26px; transform: translateY(16px); transition: transform .18s ease; max-height: 86vh; overflow-y: auto; }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 999px; margin: 6px auto 14px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .sheet-title { font-size: 17px; font-weight: 800; line-height: 1.35; }
  .sheet-close { border: none; background: var(--bg); color: var(--ink-dim); width: 26px; height: 26px; border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sheet-model { font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; }
  .sheet-badges { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .sheet-loc-badge { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--bg); color: var(--ink); }
  .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .sheet-stat { background: var(--bg); border-radius: var(--radius); padding: 10px 12px; }
  .sheet-stat-label { font-size: 10.5px; color: var(--ink-dim); font-weight: 700; margin-bottom: 3px; }
  .sheet-stat-value { font-size: 15px; font-weight: 800; }
  .sheet-note-box { background: var(--check-bg); border: 1px solid #DCD4EE; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .sheet-note-label { font-size: 11px; font-weight: 800; color: var(--check); display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .sheet-note-text { font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .sheet-audit-box { background: var(--ok-bg); border: 1px solid #CFE3CD; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .sheet-audit-box.mismatch { background: var(--bad-bg); border-color: #F0CBAE; }
  .sheet-audit-label { font-size: 11px; font-weight: 800; color: var(--ok); display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .sheet-audit-box.mismatch .sheet-audit-label { color: var(--bad); }
  .sheet-audit-text { font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .sheet-source { margin: 10px 0 16px; font-size: 11px; color: var(--ink-dim); }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-btn { flex: 1; padding: 11px; border-radius: var(--radius); font-size: 13.5px; font-weight: 700; border: none; cursor: pointer; text-align: center; }
  .sheet-btn.primary { background: var(--ink); color: #fff; }
  .sheet-btn.secondary { background: var(--bg); color: var(--ink); }
  .sheet-btn.audit { background: var(--check-bg); color: var(--check); }

  .form-field { margin-bottom: 12px; }
  .form-label { font-size: 11.5px; font-weight: 700; color: var(--ink-dim); margin-bottom: 5px; display: block; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); font-size: 14px; background: var(--surface); color: var(--ink); outline: none; font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--ink-dim); }
  .form-textarea { resize: vertical; min-height: 60px; }
  .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 100; opacity: 0; pointer-events: none; transition: all .2s ease; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,18,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; transform: scale(.96); transition: transform .15s ease; }
  .modal-overlay.open .modal-box { transform: scale(1); }
  .modal-msg { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 14px; white-space: pre-line; }
  .modal-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); font-size: 15px; background: var(--bg); color: var(--ink); outline: none; margin-bottom: 14px; letter-spacing: 0.02em; }
  .modal-input:focus { border-color: var(--ink-dim); }
  .modal-actions { display: flex; gap: 8px; }
  .modal-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .modal-btn.primary { background: var(--ink); color: #fff; }
  .modal-btn.secondary { background: var(--bg); color: var(--ink); }

  .file-input-hidden { display: none; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; z-index: 15; padding-bottom: env(safe-area-inset-bottom); }
  .bn-btn { flex: 1; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--ink-dim); cursor: pointer; border: none; background: none; }
  .bn-btn.active { color: var(--ink); }
  .bn-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <h1>(주)에스에이치 비품관리</h1>
    <button class="lock-btn" id="lockBtn"></button>
  </div>
  <div class="view-tabs" id="viewTabs">
    <div class="view-tab" data-v="dashboard">대시보드</div>

</script>
<script>
/* ===================== State & Storage ===================== */
const STATUS_ORDER = ['정상','불량','폐기','확인필요'];
const STATUS_COLOR = { '정상':'var(--ok)', '불량':'var(--bad)', '폐기':'var(--waste)', '확인필요':'var(--check)' };

let overrides = {};
let audits = {};
let editlog = [];
let settings = {};
let gsheetSyncMap = {};
let requests = {};
let scanners = {};
let nextNewId = 100000;
let nextReqId = 1;
let nextScannerId = 1;

const state = {
  view: 'dashboard',
  list: { center: '전체', query: '', status: 'all', collapsed: new Set() },
  machine: { center: '전체', query: '', status: 'all', collapsed: new Set() },
  audit: { center: '전체', query: '', onlyUnaudited: true, collapsed: new Set() },
  editUnlocked: false,
};

/* ===================== Storage helpers ===================== */
async function loadAll() {
  overrides = await safeGet('overrides', {});
  audits = await safeGet('audits', {});
  editlog = await safeGet('editlog', []);
  settings = await safeGet('settings', {});
  gsheetSyncMap = await safeGet('gsheetSyncMap', {});
  requests = await safeGet('requests', {});
  scanners = await safeGet('scanners', {});
  const ids = Object.keys(overrides).map(k => parseInt(k)).filter(n => n >= 100000);
  if (ids.length) nextNewId = Math.max(...ids) + 1;
  const reqIds = Object.keys(requests).map(k => parseInt(k.replace('req',''))).filter(n => !isNaN(n));
  if (reqIds.length) nextReqId = Math.max(...reqIds) + 1;
  const scanIds = Object.keys(scanners).map(k => parseInt(k.replace('sc',''))).filter(n => !isNaN(n));
  if (scanIds.length) nextScannerId = Math.max(...scanIds) + 1;
}
const HAS_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null);
const DEFAULT_GSHEET_URL = 'https://docs.google.com/spreadsheets/d/1JhR9f6U3WYVBjS6V5iukx1BA5FrN6nfpkvQrbd17yHQ/edit?usp=sharing';

async function safeGet(key, fallback) {
  if (!HAS_STORAGE) return fallback;
  try {
    const res = await window.storage.get(key, true);
    if (res && res.value !== undefined) return JSON.parse(res.value);
    return fallback;
  } catch (e) { return fallback; }
}
async function safeSet(key, value, _retried) {
  if (!HAS_STORAGE) return false;
  try {
    await window.storage.set(key, JSON.stringify(value), true);
    return true;
  } catch (e) {
    console.error('storage set failed', key, e);
    if (!_retried) {
      // transient server hiccups happen occasionally — wait briefly and try once more
      await new Promise(r => setTimeout(r, 700));
      return safeSet(key, value, true);
    }
    return false;
  }
}
function pushLog(text) {
  editlog.unshift({ ts: new Date().toISOString(), text });
  editlog = editlog.slice(0, 100);
  safeSet('editlog', editlog);
}

/* ===================== Data merge ===================== */
function getEffectiveData() {
  const map = {};
  BASE_DATA.forEach(d => { map[d.id] = { ...d }; });
  Object.keys(overrides).forEach(idStr => {
    const id = parseInt(idStr);
    map[id] = { ...(map[id] || {}), ...overrides[idStr], id };
  });
  return Object.values(map).filter(d => !d.deleted);
}
function getAudit(id) { return audits[id] || null; }

const REQUEST_TYPES = ['확인요청','불량처리요청','A/S요청'];
function getPendingRequests(id) {
  return Object.entries(requests).filter(([rid, r]) => r.itemId === id && r.status === 'pending').map(([rid, r]) => ({ ...r, rid }));
}
function getAllRequests(id) {
  return Object.entries(requests).filter(([rid, r]) => r.itemId === id).map(([rid, r]) => ({ ...r, rid })).sort((a,b) => b.requestedAt.localeCompare(a.requestedAt));
}

/* ===================== Crypto (PIN) ===================== */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function handleLockClick() {
  if (state.editUnlocked) {
    state.editUnlocked = false; renderLockBtn(); showToast('편집 잠금이 설정되었습니다'); return;
  }
  const ok = await requestUnlock();
  if (ok) showToast('편집 잠금이 해제되었습니다');
}
function requestUnlock() {
  return new Promise(async (resolve) => {
    if (!settings.pinHash) {
      const p1 = await customPrompt('편집 PIN을 새로 설정하세요 (4자리 이상 숫자/문자)', { type: 'password' });
      if (!p1) { resolve(false); return; }
      const p2 = await customPrompt('PIN을 다시 한 번 입력하세요', { type: 'password' });
      if (p1 !== p2) { await customAlert('입력한 PIN이 서로 다릅니다. 다시 시도해주세요.'); resolve(false); return; }
      settings.pinHash = await sha256(p1);
      await safeSet('settings', settings);
      state.editUnlocked = true; renderLockBtn(); resolve(true); return;
    }
    const p = await customPrompt('편집 PIN을 입력하세요', { type: 'password' });
    if (p === null) { resolve(false); return; }
    const hash = await sha256(p);
    if (hash === settings.pinHash) { state.editUnlocked = true; renderLockBtn(); resolve(true); }
    else { await customAlert('PIN이 올바르지 않습니다.'); resolve(false); }
  });
}
function renderLockBtn() {
  const btn = document.getElementById('lockBtn');
  btn.classList.toggle('unlocked', state.editUnlocked);
  btn.innerHTML = state.editUnlocked
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>편집 가능`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>잠김`;
}

/* ===================== Toast ===================== */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== Custom modal (published/embedded artifacts often block window.prompt/alert/confirm) ===================== */
const modalOverlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');

function customAlert(msg) {
  return new Promise((resolve) => {
    modalBox.innerHTML = `<div class="modal-msg">${escapeHtml(msg)}</div><div class="modal-actions"><button class="modal-btn primary" id="modalOkBtn">확인</button></div>`;
    modalOverlay.classList.add('open');
    document.getElementById('modalOkBtn').onclick = () => { modalOverlay.classList.remove('open'); resolve(); };
  });
}
function customConfirm(msg) {
  return new Promise((resolve) => {
    modalBox.innerHTML = `<div class="modal-msg">${escapeHtml(msg)}</div><div class="modal-actions"><button class="modal-btn secondary" id="modalCancelBtn">취소</button><button class="modal-btn primary" id="modalOkBtn">확인</button></div>`;
    modalOverlay.classList.add('open');
    document.getElementById('modalCancelBtn').onclick = () => { modalOverlay.classList.remove('open'); resolve(false); };
    document.getElementById('modalOkBtn').onclick = () => { modalOverlay.classList.remove('open'); resolve(true); };
  });
}
function customPrompt(msg, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    modalBox.innerHTML = `<div class="modal-msg">${escapeHtml(msg)}</div><input type="${opts.type || 'text'}" class="modal-input" id="modalInput" placeholder="${escapeAttr(opts.placeholder || '')}" autocomplete="off"><div class="modal-actions"><button class="modal-btn secondary" id="modalCancelBtn">취소</button><button class="modal-btn primary" id="modalOkBtn">확인</button></div>`;
    modalOverlay.classList.add('open');
    const input = document.getElementById('modalInput');
    setTimeout(() => input.focus(), 60);
    const finish = (val) => { modalOverlay.classList.remove('open'); resolve(val); };
    document.getElementById('modalCancelBtn').onclick = () => finish(null);
    document.getElementById('modalOkBtn').onclick = () => finish(input.value);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(input.value); });
  });
}

/* ===================== View switching ===================== */
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.onclick = () => { state.view = tab.dataset.v; renderView(); };
});
function renderView() {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.v === state.view));
  document.getElementById('dashboardView').style.display = state.view === 'dashboard' ? '' : 'none';
  document.getElementById('listView').style.display = state.view === 'list' ? '' : 'none';
  document.getElementById('machineView').style.display = state.view === 'machine' ? '' : 'none';
  document.getElementById('auditView').style.display = state.view === 'audit' ? '' : 'none';
  if (state.view === 'dashboard') renderDashboard();
  else if (state.view === 'list') renderList();
  else if (state.view === 'machine') renderMachine();
  else if (state.view === 'audit') renderAudit();
}

/* ===================== Dashboard ===================== */
function renderDashboard() {
  const data = getEffectiveData();
  const totalItems = data.length;
  const totalQty = data.reduce((s,d) => s + d.qty, 0);

  const byStatus = {}; STATUS_ORDER.forEach(s => byStatus[s] = 0);
  data.forEach(d => { byStatus[d.status] = (byStatus[d.status]||0) + d.qty; });

  const byCenter = {};
  data.forEach(d => { byCenter[d.center] = (byCenter[d.center]||0) + d.qty; });

  const auditedIds = new Set(Object.keys(audits).map(k => parseInt(k)));
  const currentIds = new Set(data.map(d => d.id));
  const auditedCount = [...auditedIds].filter(id => currentIds.has(id)).length;
  const auditPct = totalItems ? Math.round(auditedCount / totalItems * 100) : 0;

  const mismatches = data.filter(d => { const a = audits[d.id]; return a && a.checkedQty !== d.qty; });

  const dash = document.getElementById('dashboardView');
  dash.innerHTML = `
    <div class="dash">
      <div class="dash-hero">
        <div class="dash-hero-label">전체 비품 현황</div>
        <div class="dash-hero-row">
          <div class="dash-hero-stat clickable" id="heroGoList"><div class="num">${totalItems}</div><div class="lbl">품목 (SKU) →</div></div>
          <div class="dash-hero-stat" style="text-align:right;"><div class="num">${totalQty.toLocaleString()}</div><div class="lbl">총 수량(개)</div></div>
        </div>
      </div>

      <div class="dash-grid">
        ${getSortedCenters(data).map(c => `
        <div class="dash-card clickable" data-center="${escapeAttr(c)}">
          <div class="dash-card-label">${escapeHtml(c)}</div>
          <div class="dash-card-value">${(byCenter[c]||0).toLocaleString()}개</div>
          <div class="dash-card-sub">${data.filter(d=>d.center===c).length}개 품목 →</div>
        </div>`).join('')}
      </div>

      <div class="section-title">상태별 수량 <span style="font-weight:500;color:var(--ink-dim);">· 눌러서 해당 목록 보기</span></div>
      <div class="dash-card">
        ${STATUS_ORDER.map(s => {
          const pct = totalQty ? (byStatus[s]/totalQty*100) : 0;
          return `<div class="bar-row clickable" data-status="${s}">
            <div class="bar-label" style="color:${STATUS_COLOR[s]}">${s}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${STATUS_COLOR[s]}"></div></div>
            <div class="bar-val">${byStatus[s].toLocaleString()}개</div>
          </div>`;
        }).join('')}
      </div>

      <div class="section-title-row">
        <div class="section-title" id="pm3SectionTitle">PM3 보유 현황</div>
        ${state.editUnlocked ? `<button class="mini-add-btn" id="scannerAddBtn">+ 추가</button>` : ''}
      </div>
      <div class="scanner-list" id="scannerList"></div>
    </div>
  `;

  renderScannerList();
  const scanAddBtn = document.getElementById('scannerAddBtn');
  if (scanAddBtn) scanAddBtn.onclick = () => openScannerEdit(null);

  document.getElementById('heroGoList').onclick = () => { state.list.center = '전체'; state.list.status = 'all'; state.list.query = ''; state.view = 'list'; renderView(); };
  dash.querySelectorAll('[data-center]').forEach(el => {
    el.onclick = () => {
      state.list.center = el.dataset.center; state.list.status = 'all'; state.list.query = '';
      state.view = 'list'; renderView();
    };
  });
  dash.querySelectorAll('[data-status]').forEach(el => {
    el.onclick = () => {
      state.list.status = el.dataset.status; state.list.center = '전체'; state.list.query = '';
      state.view = 'list'; renderView();
    };
  });
}

/* ===================== PM3 보유 현황 (센터별 · 사용자별) ===================== */
function last4(serial) {
  const s = String(serial || '').replace(/\s/g, '');
  return s ? s.slice(-4) : '';
}

function renderScannerList() {
  const listEl = document.getElementById('scannerList');
  const titleEl = document.getElementById('pm3SectionTitle');
  if (!listEl) return;
  const entries = Object.values(scanners);
  if (entries.length === 0) {
    if (titleEl) titleEl.textContent = 'PM3 보유 현황';
    listEl.innerHTML = '<div class="empty-activity">등록된 데이터가 없습니다.</div>';
    return;
  }
  const grandHave = entries.length;
  const grandInUse = entries.filter(s => s.inUse).length;
  const grandUnused = grandHave - grandInUse;
  if (titleEl) titleEl.textContent = `PM3 보유 현황 (보유 ${grandHave}·사용 ${grandInUse}·미사용 ${grandUnused})`;

  const centers = getSortedCenters(entries).sort((a,b) => pm3CenterRank(a) - pm3CenterRank(b));
  const totalsByCenter = {};
  centers.forEach(c => {
    const rows = entries.filter(s => s.center === c);
    totalsByCenter[c] = {
      have: rows.length,
      inUse: rows.filter(s => s.inUse).length,
      unused: rows.filter(s => !s.inUse).length,
    };
  });

  listEl.innerHTML = `<div class="pm3-columns">${centers.map(c => {
    const rows = Object.entries(scanners).filter(([sid, s]) => s.center === c)
      .sort((a,b) => (b[1].inUse - a[1].inUse) || a[1].user.localeCompare(b[1].user, 'ko'));
    const t = totalsByCenter[c];
    return `
    <div class="pm3-col">
      <div class="pm3-col-title">${escapeHtml(c)}</div>
      <div class="pm3-col-total">보유 ${t.have} · 사용 ${t.inUse} · 미사용 ${t.unused}</div>
      ${rows.map(([sid, s]) => `
        <div class="pm3-col-row" ${state.editUnlocked ? `data-scan-edit="${sid}"` : ''}>
          <div class="pm3-zone">${escapeHtml(s.user)}</div>
          <div class="pm3-nums">${s.inUse ? '사용' : '미사용'}${last4(s.serial) ? ' · ' + escapeHtml(last4(s.serial)) : ''}</div>
        </div>
      `).join('')}
    </div>`;
  }).join('')}</div>`;

  if (state.editUnlocked) {
    listEl.querySelectorAll('[data-scan-edit]').forEach(el => {
      el.onclick = () => openScannerEdit(el.dataset.scanEdit);
    });
  }
}

function openScannerEdit(sid) {
  const isNew = !sid;
  const rec = isNew ? { center: getSortedCenters(getEffectiveData())[0] || '1센터', user: '', inUse: true, serial: '', model: '', note: '' } : scanners[sid];
  sheetPanel.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-top"><div class="sheet-title">${isNew ? 'PM3 보유자 추가' : 'PM3 보유 정보 수정'}</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>
    <div class="form-row2">

function formatRelTime(iso) {
  const d = new Date(iso);
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return '방금 전';
  if (diffMin < 60) return diffMin + '분 전';
  const diffH = Math.round(diffMin/60);
  if (diffH < 24) return diffH + '시간 전';
  const diffD = Math.round(diffH/24);
  if (diffD < 7) return diffD + '일 전';
  return d.toLocaleDateString('ko-KR');
}

/* ===================== Shared zone-group rendering ===================== */
function zoneSortKey(za, zb) {
  if (za.center !== zb.center) return za.center.localeCompare(zb.center, 'ko');
  const aFlag = za.zone === '위치 미상' ? 2 : (za.zone.includes('불량') || za.zone.includes('폐기')) ? 1 : 0;
  const bFlag = zb.zone === '위치 미상' ? 2 : (zb.zone.includes('불량') || zb.zone.includes('폐기')) ? 1 : 0;
  if (aFlag !== bFlag) return aFlag - bFlag;
  return za.zone.localeCompare(zb.zone, 'ko');
}

function renderZoneGroups(containerEl, filtered, collapsedSet, showCenterBadge, auditMode, onZoneToggle) {
  if (filtered.length === 0) {
    containerEl.innerHTML = '<div class="empty-state">해당하는 품목이 없습니다.</div>';
    return;
  }
  const byZone = {};
  filtered.forEach(d => {
    const key = d.center + '|' + d.zone;
    if (!byZone[key]) byZone[key] = { center: d.center, zone: d.zone, items: [] };
    byZone[key].items.push(d);
  });
  const zoneKeys = Object.keys(byZone).sort((a,b) => zoneSortKey(byZone[a], byZone[b]));

  containerEl.innerHTML = '';
  zoneKeys.forEach(key => {
    const { center, zone, items } = byZone[key];
    const qtySum = items.reduce((s,d) => s + d.qty, 0);
    const isCollapsed = collapsedSet.has(key);

    const group = document.createElement('div');
    group.className = 'zone-group' + (isCollapsed ? ' collapsed' : '');

    const centerBadgeHtml = showCenterBadge
      ? `<span class="center-badge ${centerBadgeClass(center)}">${center}</span>` : '';

    const header = document.createElement('div');
    header.className = 'zone-header';
    header.innerHTML = `
      <div class="zone-title">${centerBadgeHtml}<span class="zone-pin"></span>${zone}</div>
      <div class="zone-meta">${items.length}건 · ${qtySum}개
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>`;
    header.onclick = () => { onZoneToggle(key); };
    group.appendChild(header);

    const list = document.createElement('div');
    list.className = 'item-list';
    items.sort((a,b) => a.category.localeCompare(b.category,'ko') || a.item.localeCompare(b.item,'ko'));

    items.forEach(d => {
      const audit = getAudit(d.id);
      const pendingReq = getPendingRequests(d.id);
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-info">
          <div class="item-name">${escapeHtml(d.item)}</div>
          ${d.model ? `<div class="item-model">${escapeHtml(d.model)}</div>` : ''}
          <div>
          ${d.note ? `<span class="item-note-flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>특이사항</span>` : ''}
          ${pendingReq.length ? `<span class="request-flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${pendingReq.length > 1 ? pendingReq.length + '건 요청' : pendingReq[0].type}</span>` : ''}
          ${audit ? `<span class="audited-flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>실사완료${audit.checkedQty !== d.qty ? ' (불일치)' : ''}</span>` : ''}
          </div>
        </div>
        <div class="item-right">
          <div class="qty">${d.qty}<span style="font-size:11px;font-weight:600;color:var(--ink-dim)">개</span></div>
          <div class="status-badge ${d.status}">${d.status}</div>
        </div>
        ${auditMode ? `<button class="quick-check-btn" data-quickcheck="${d.id}" title="수량 일치로 실사 확인">✓</button>` : ''}
      `;
      row.onclick = (e) => {
        if (e.target.closest('[data-quickcheck]')) return;
        openDetail(d.id, auditMode);
      };
      list.appendChild(row);
    });

    group.appendChild(list);
    containerEl.appendChild(group);
  });

  if (auditMode) {
    containerEl.querySelectorAll('[data-quickcheck]').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); quickAudit(parseInt(btn.dataset.quickcheck)); };
    });
  }
}

/* ===================== List / Machine / Audit views ===================== */
function centerBadgeClass(c) {
  if (c === '1센터') return 'c1';
  if (c === '2센터') return 'c2';
  return 'c3';
}

function centerRank(c) {
  if (c === '관리부') return -1;
  const m = String(c).match(/^(\d+)\s*센터/);
  if (m) return parseInt(m[1]);
  return 999;
}
function getSortedCenters(data) {
  const set = new Set(data.map(d => d.center).filter(Boolean));
  return [...set].sort((a,b) => centerRank(a) - centerRank(b) || a.localeCompare(b, 'ko'));
}
function buildCenterTabs(containerEl, data, sub, onPick) {
  const centers = ['전체', ...getSortedCenters(data)];
  containerEl.innerHTML = '';
  centers.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'center-tab' + (c === sub.center ? ' active' : '');
    btn.dataset.c = c; btn.textContent = c;
    btn.onclick = () => { sub.center = c; sub.collapsed.clear(); onPick(); };
    containerEl.appendChild(btn);
  });
}
const MACHINE_SOURCE = '기계목록';

function matchesFilter(d, sub, scope) {
  if (scope === 'nonMachine' && d.source === MACHINE_SOURCE) return false;
  if (scope === 'machine' && d.source !== MACHINE_SOURCE) return false;
  if (sub.center !== '전체' && d.center !== sub.center) return false;
  if (sub.status && sub.status !== 'all' && d.status !== sub.status) return false;
  if (sub.query) {
    const hay = (d.item + ' ' + d.model + ' ' + d.zone + ' ' + d.category + ' ' + d.subcategory).toLowerCase();
    if (!hay.includes(sub.query)) return false;
  }
  return true;
}

function renderAuditSheet(d) {
  sheetPanel.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-top"><div class="sheet-title">실사 확인</div><button class="sheet-close" id="sheetCloseBtn">✕</button></div>
    <div class="sheet-model">${escapeHtml(d.item)} · ${escapeHtml(d.zone)}</div>
    <div class="form-field">

      <input type="number" class="form-input" id="auditQtyInput" value="${d.qty}" min="0">
    </div>
    <div class="form-field">
      <label class="form-label">상태 지정</label>
      <select class="form-select" id="auditStatusInput">${STATUS_ORDER.map(s => `<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="form-field">
      <label class="form-label">메모 (선택)</label>
      <textarea class="form-textarea" id="auditNoteInput" placeholder="예: 3구역에서 발견, 파손 확인 등"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn secondary" id="auditCancelBtn">취소</button>
      <button class="sheet-btn primary" id="auditSaveBtn">실사 결과 저장</button>
    </div>
  `;
  document.getElementById('sheetCloseBtn').onclick = closeDetail;
  document.getElementById('auditCancelBtn').onclick = () => renderViewSheet(d, true);
  document.getElementById('auditSaveBtn').onclick = async () => {
    if (!state.editUnlocked) {
      const ok = await requestUnlock();
      if (!ok) return;
    }
    const qty = parseInt(document.getElementById('auditQtyInput').value) || 0;
    const newStatus = document.getElementById('auditStatusInput').value;
    const note = document.getElementById('auditNoteInput').value.trim();
    const matched = qty === d.qty;

    audits[d.id] = { checkedAt: new Date().toISOString(), checkedQty: qty, matched, note };
    const okAudit = await safeSet('audits', audits);

    const statusChanged = newStatus !== d.status;
    let okOverride = true;
    if (statusChanged) {
      overrides[d.id] = { ...d, status: newStatus, updatedAt: new Date().toISOString() };
      okOverride = await safeSet('overrides', overrides);
    }
    if (!okAudit || !okOverride) {
      await customAlert('저장소 오류로 저장에 실패했습니다. 다시 시도해주세요.');
      return;
    }
    pushLog(`실사 확인: ${d.item} (${d.zone}) — ${qty}개${matched ? ', 일치' : `, 기록(${d.qty}개)과 다름`}${statusChanged ? `, 상태 → ${newStatus}` : ''}`);
    showToast(matched ? '실사 확인되었습니다' : '차이가 발견되어 기록되었습니다');
    renderViewSheet({ ...d, status: newStatus }, true);
  };
}

function exportExcel() {
  const data = getEffectiveData();
  const rows = data.map(d => {
    const a = getAudit(d.id);
    return {
      'ID': d.id, '센터': d.center, '구역/보관장소': d.zone, '분류': d.category, '소분류': d.subcategory,
      '품목': d.item, '모델명': d.model, '상태': d.status, '수량': d.qty, '비고': d.note,
      '최근실사일': a ? a.checkedAt.slice(0,10) : '', '실사수량': a ? a.checkedQty : '',
      '실사일치여부': a ? (a.matched ? '일치' : '불일치') : '', '출처': d.source || '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:8},{wch:16},{wch:10},{wch:10},{wch:26},{wch:22},{wch:8},{wch:8},{wch:30},{wch:12},{wch:10},{wch:12},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '비품재고');
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  XLSX.writeFile(wb, `비품재고_${today}.xlsx`);
  pushLog(`엑셀 내보내기: ${rows.length}건`);
  showToast('엑셀 파일을 내보냈습니다');
}

document.getElementById('excelUploadInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if (!rows.length) { await customAlert('업로드한 파일에서 데이터를 찾을 수 없습니다.'); return; }

    if (!state.editUnlocked) {
      const proceed = await customConfirm('일괄 업로드는 편집 잠금 해제가 필요합니다. PIN을 입력하시겠습니까?');
      if (!proceed) { e.target.value = ''; return; }
      const ok = await requestUnlock();
      if (!ok) { e.target.value = ''; return; }
    }

    let updated = 0, added = 0;
    rows.forEach(r => {
      const idRaw = r['ID'];
      const rec = {
        center: String(r['센터']||'').trim(),
        zone: String(r['구역/보관장소']||'').trim() || '위치 미상',
        category: String(r['분류']||'').trim(),
        subcategory: String(r['소분류']||'').trim(),
        item: String(r['품목']||'').trim(),
        model: String(r['모델명']||'').trim(),
        status: STATUS_ORDER.includes(r['상태']) ? r['상태'] : '정상',
        qty: parseInt(r['수량']) || 0,
        note: String(r['비고']||'').trim(),
        source: String(r['출처']||'') || '엑셀 업로드',
        updatedAt: new Date().toISOString(),
      };
      if (!rec.item || !rec.center) return;
      let id;
      if (idRaw !== '' && idRaw !== undefined && idRaw !== null && !isNaN(parseInt(idRaw))) { id = parseInt(idRaw); updated++; }
      else { id = nextNewId++; added++; }
      overrides[id] = rec;
    });
    await safeSet('overrides', overrides);
    pushLog(`엑셀 일괄 업로드: 수정 ${updated}건, 추가 ${added}건`);
    showToast(`업로드 완료 — 수정 ${updated}건, 추가 ${added}건`);
    renderView();
  } catch (err) {
    console.error(err);
    await customAlert('파일을 읽는 중 오류가 발생했습니다. 내보내기한 양식과 동일한 파일인지 확인해주세요.');
  } finally { e.target.value = ''; }
});

function parsePm3InUse(val) {

  if (s.includes('미사용')) return false;

  return false;
}
const PM3_INVALID_USER_VALUES = ['미사용', '사용', '없음', '미배정', '공석', '-', 'x', 'X'];
function isValidPm3User(name) {

    };
  } else {
    const shortUrl = settings.gsheetUrl.length > 38 ? settings.gsheetUrl.slice(0,38) + '…' : settings.gsheetUrl;
    card.innerHTML = `
      <div class="gsheet-top">
        <div class="gsheet-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>연동됨</div>
        <div class="gsheet-status">${settings.gsheetLastSync ? '마지막 동기화: ' + formatRelTime(settings.gsheetLastSync) : '아직 동기화 안 함'}</div>
      </div>
      <div class="gsheet-hint" style="margin:0 0 8px;word-break:break-all;">${escapeHtml(shortUrl)}</div>
      <div class="gsheet-synced-row">
        <button class="gsheet-btn secondary" id="gsheetUnlinkBtn">연결 해제</button>
        <button class="gsheet-btn" id="gsheetSyncNowBtn">지금 동기화</button>
      </div>
    `;
    document.getElementById('gsheetSyncNowBtn').onclick = async () => {
      if (!state.editUnlocked) { const ok = await requestUnlock(); if (!ok) return; }
      if (!(await customConfirm('시트 내용으로 전체 데이터를 덮어씁니다. 시트에 없는 기존 품목·인원은 삭제 처리돼요. 계속할까요?'))) return;
      syncGoogleSheet(false);
    };
    document.getElementById('gsheetUnlinkBtn').onclick = async () => {
      if (!state.editUnlocked) { const ok = await requestUnlock(); if (!ok) return; }
      if (!(await customConfirm('구글시트 연동을 해제할까요? (이미 가져온 데이터는 유지됩니다)'))) return;
      delete settings.gsheetUrl;
      delete settings.gsheetLastSync;
      await safeSet('settings', settings);
      renderGsheetCard();
      showToast('연동이 해제되었습니다');
    };
  }
}

function extractSheetId(url) {
  const m = String(url).match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : null;
}
function gvizCsvUrl(sheetId, tabName) {
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
}

async function fetchTabCsv(sheetId, tabName) {
  const res = await fetch(gvizCsvUrl(sheetId, tabName), { cache: 'no-store' });
  if (!res.ok) throw new Error(tabName + ': HTTP ' + res.status);
  const text = await res.text();
  // gviz returns an HTML error page (not CSV) if the tab name is wrong or the sheet isn't link-shared
  if (/^\s*<!DOCTYPE html/i.test(text) || /<html/i.test(text.slice(0, 200))) return null;
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  return parsed.data;
}

async function syncGoogleSheet(silent) {
  if (!settings.gsheetUrl || typeof Papa === 'undefined') return;
  const btn = document.getElementById('gsheetSyncNowBtn');
  if (btn) { btn.textContent = '동기화 중…'; btn.disabled = true; }
  try {
    const sheetId = extractSheetId(settings.gsheetUrl);
    if (!sheetId) throw new Error('링크에서 시트 ID를 찾지 못했습니다.');

    if (!gsheetSyncMap.biz) gsheetSyncMap.biz = {};
    if (!gsheetSyncMap.machine) gsheetSyncMap.machine = {};
    if (!gsheetSyncMap.pm3) gsheetSyncMap.pm3 = {};

    let itemAdded = 0, itemUpdated = 0, itemRemoved = 0;
    let scanAdded = 0, scanUpdated = 0, scanRemoved = 0;
    const missingTabs = [];
    const perTabCounts = {};

    // --- 비품 + 기계 → items (각 탭은 각자 헤더 구성이 다름) ---
    for (const tabKey of ['biz', 'machine']) {
      const sheetName = GSHEET_TABS[tabKey];
      const fieldMap = tabKey === 'machine' ? MACHINE_FIELD_MAP : GSHEET_FIELD_MAP;
      const rows = await fetchTabCsv(sheetId, sheetName);
      const seenKeys = new Set();
      let added = 0, updated = 0, removed = 0;
      if (rows === null) {
        missingTabs.push(sheetName);
      } else {
        rows.forEach((row, i) => {
          const rec = { source: sheetName, updatedAt: new Date().toISOString() };
          Object.keys(fieldMap).forEach(kr => { rec[fieldMap[kr]] = String(row[kr] || '').trim(); });
          if (!rec.center || !rec.item) return;
          rec.zone = rec.zone || '위치 미상';
          rec.status = STATUS_ORDER.includes(rec.status) ? rec.status : '정상';
          rec.qty = parseInt(rec.qty) || 1;
          if (tabKey === 'machine' && !rec.category) rec.category = rec.subcategory;

          const externalKey = 'g_' + tabKey + '_' + i;
          seenKeys.add(externalKey);
          let id = gsheetSyncMap[tabKey][externalKey];
          if (id === undefined) { id = nextNewId++; gsheetSyncMap[tabKey][externalKey] = id; added++; }
          else { updated++; }
          overrides[id] = rec;
        });
      }
      // only clean up stale entries if we actually got a successful read for this tab
      if (rows !== null) {
        Object.keys(gsheetSyncMap[tabKey]).forEach(key => {
          if (!seenKeys.has(key)) {
            const id = gsheetSyncMap[tabKey][key];
            overrides[id] = { ...(overrides[id] || {}), deleted: true, updatedAt: new Date().toISOString() };
            delete gsheetSyncMap[tabKey][key];
            removed++;
          }
        });
      }
      perTabCounts[tabKey] = { added, updated, removed, found: rows !== null, rowCount: rows ? rows.length : 0 };
      itemAdded += added; itemUpdated += updated; itemRemoved += removed;
    }

    // --- PM3현황 → 사용자별 보유 현황 (사용자가 실명 또는 '공용'인 행만 유효) ---
    const pm3Rows = await fetchTabCsv(sheetId, GSHEET_TABS.pm3);
    const seenPm3Keys = new Set();
    if (pm3Rows === null) {
      missingTabs.push(GSHEET_TABS.pm3);
    } else {
      pm3Rows.forEach((row, i) => {
        const rec = {};
        Object.keys(PM3_FIELD_MAP).forEach(kr => { rec[PM3_FIELD_MAP[kr]] = row[kr]; });
        const center = String(rec.center || '').trim();
        const user = String(rec.user || '').trim();
        if (!center || !isValidPm3User(user)) return;
        const inUse = parsePm3InUse(rec.inUseRaw);
        const externalKey = 'g_pm3_' + i;
        seenPm3Keys.add(externalKey);
        let id = gsheetSyncMap.pm3[externalKey];
        if (id === undefined) { id = 'sc' + (nextScannerId++); gsheetSyncMap.pm3[externalKey] = id; scanAdded++; }
        else { scanUpdated++; }
        scanners[id] = {
          center, user, inUse,
          serial: String(rec.serial || '').trim(),
          model: String(rec.model || '').trim(),
          note: String(rec.note || '').trim(),
          updatedAt: new Date().toISOString(),
        };
      });
      Object.keys(gsheetSyncMap.pm3).forEach(key => {
        if (!seenPm3Keys.has(key)) {
          delete scanners[gsheetSyncMap.pm3[key]];
          delete gsheetSyncMap.pm3[key];
          scanRemoved++;
        }
      });
    }

    await safeSet('overrides', overrides);
    await safeSet('scanners', scanners);
    await safeSet('gsheetSyncMap', gsheetSyncMap);
    settings.gsheetLastSync = new Date().toISOString();
    await safeSet('settings', settings);

    if (missingTabs.length === 3) {
      throw new Error('탭을 하나도 읽지 못했습니다. 시트가 "링크가 있는 모든 사용자" 보기 권한으로 공유되어 있는지 확인해주세요.');
    }
    const bizC = perTabCounts.biz, machC = perTabCounts.machine;
    const summary = `비품 ${bizC.found ? `${bizC.rowCount}행(추가${bizC.added}·수정${bizC.updated}·삭제${bizC.removed})` : '못읽음'} · 기계 ${machC.found ? `${machC.rowCount}행(추가${machC.added}·수정${machC.updated}·삭제${machC.removed})` : '못읽음'} · PM3 추가${scanAdded}·수정${scanUpdated}·삭제${scanRemoved}`;
    pushLog(`구글시트 전체 동기화: ${summary}`);
    if (missingTabs.length) {
      await customAlert(`동기화 결과: ${summary}\n\n못 읽은 탭이 있습니다: ${missingTabs.join(', ')}\n탭 이름이 정확한지 확인해주세요.`);
    } else if (!silent) {
      showToast('동기화 완료 — ' + summary);
    } else {
      showToast('구글시트에서 자동 동기화되었습니다 — ' + summary);
    }
    renderGsheetCard();
    renderView();
  } catch (err) {
    console.error('gsheet sync failed', err);
    if (!silent) await customAlert('구글시트를 불러오지 못했습니다. 시트가 "링크가 있는 모든 사용자 - 뷰어" 로 공유되어 있는지, 붙여넣은 링크가 시트 주소인지 확인해주세요.\n\n' + err.message);
  } finally {
    if (btn) { btn.textContent = '지금 동기화'; btn.disabled = false; }
  }
}

/* ===================== Init ===================== */
document.getElementById('lockBtn').onclick = handleLockClick;
document.getElementById('xlExportBtn').onclick = exportExcel;
document.getElementById('xlImportBtn').onclick = () => document.getElementById('excelUploadInput').click();

(async function init() {
  renderLockBtn();
  await loadAll();
  renderView();
  if (!HAS_STORAGE) {
    // No persistent storage here (e.g. hosted outside claude.ai) — nothing survives
    // a reload anyway, so it's safe (and necessary) to auto-sync from the sheet
    // every time the page loads, for every visitor, so everyone sees live data.
    if (!settings.gsheetUrl) settings.gsheetUrl = DEFAULT_GSHEET_URL;
    await syncGoogleSheet(true);
  }
  // When storage IS available (claude.ai), full-replace sync only runs via the
  // "지금 동기화" button, to avoid wiping accumulated edits if the sheet happens
  // to be mid-edit when someone opens the app.
})();

</script>
